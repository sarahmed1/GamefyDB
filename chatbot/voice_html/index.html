<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }
    .wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 2px 0;
    }
    #micBtn {
      position: relative;
      background: linear-gradient(180deg, #4b5563 0%, #374151 100%);
      border: 1px solid #1f2937;
      border-radius: 50%;
      width: 52px; height: 52px;
      cursor: pointer; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 80ms ease, background 120ms ease, box-shadow 120ms ease;
    }
    #micBtn:hover { background: linear-gradient(180deg, #5b6573 0%, #404a59 100%); }
    #micBtn:active { transform: scale(0.94); }
    #micBtn.listening {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: #7f1d1d;
      box-shadow: 0 0 0 6px rgba(239,68,68,0.18), 0 2px 8px rgba(0,0,0,0.4);
      animation: pulse 1.1s infinite ease-in-out;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 6px rgba(239,68,68,0.18), 0 2px 8px rgba(0,0,0,0.4); }
      50%     { box-shadow: 0 0 0 12px rgba(239,68,68,0.08), 0 2px 8px rgba(0,0,0,0.4); }
    }
    #status {
      font-size: 12px; line-height: 1.3;
      color: #9ca3af;
      text-align: center;
      max-width: 100%;
      word-wrap: break-word;
      min-height: 16px;
    }
    #status.ok    { color: #34d399; }
    #status.err   { color: #f87171; }
    #status.live  { color: #fbbf24; font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="micBtn" title="Hold to speak, release to send" aria-label="Hold to speak">🎤</button>
    <div id="status">hold to talk</div>
  </div>
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let lang = "en-US";

    window.addEventListener("message", (e) => {
      if (e.data.type === "streamlit:render" && e.data.args && e.data.args.lang) {
        lang = e.data.args.lang;
      }
    });

    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
    function setHeight() {
      const h = document.querySelector(".wrap").getBoundingClientRect().height + 4;
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: Math.ceil(h) }, "*");
    }
    setHeight();
    new ResizeObserver(setHeight).observe(document.querySelector(".wrap"));

    function sendValue(val) {
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value: val, dataType: "json" }, "*");
    }

    const btn = document.getElementById("micBtn");
    const status = document.getElementById("status");

    function setStatus(text, cls) {
      status.className = cls || "";
      status.textContent = text;
    }

    let recognition = null;
    let finalText = "";
    let userStopped = false;

    function startListening() {
      if (recognition) return;
      if (!SpeechRecognition) { setStatus("not supported (use Chrome / Edge)", "err"); return; }
      recognition = new SpeechRecognition();
      recognition.lang = lang;
      recognition.continuous = true;
      recognition.interimResults = true;
      finalText = "";
      userStopped = false;

      recognition.onstart = () => {
        btn.textContent = "🔴";
        btn.classList.add("listening");
        setStatus("listening… release to send", "live");
      };
      recognition.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += t;
          else interim += t;
        }
        setStatus((finalText + interim).trim() || "listening…", "live");
      };
      recognition.onerror = (ev) => {
        const reasons = {
          "no-speech":             "no speech — hold longer",
          "audio-capture":         "no microphone found",
          "not-allowed":           "mic blocked — allow it",
          "service-not-allowed":   "speech service blocked",
          "network":               "network error (browser STT)",
          "aborted":               "",
          "language-not-supported":"language not supported",
        };
        const msg = reasons[ev.error];
        if (msg !== "") setStatus(msg || ("error: " + ev.error), "err");
      };
      recognition.onend = () => {
        btn.textContent = "🎤";
        btn.classList.remove("listening");
        const text = finalText.trim();
        if (text) {
          setStatus("✓ " + text, "ok");
          sendValue(text);
        } else if (userStopped) {
          setStatus("no speech — hold longer", "err");
        }
        recognition = null;
      };
      try { recognition.start(); }
      catch (err) { setStatus("could not start: " + err.message, "err"); recognition = null; }
    }

    function stopListening() {
      if (!recognition) return;
      userStopped = true;
      try { recognition.stop(); } catch (e) { /* ignore */ }
    }

    btn.addEventListener("mousedown",  (e) => { e.preventDefault(); startListening(); });
    btn.addEventListener("mouseup",    (e) => { e.preventDefault(); stopListening();  });
    btn.addEventListener("mouseleave", ()  => { if (recognition) stopListening(); });
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); startListening(); }, { passive: false });
    btn.addEventListener("touchend",   (e) => { e.preventDefault(); stopListening();  }, { passive: false });
    btn.addEventListener("contextmenu",(e) => e.preventDefault());

    if (!SpeechRecognition) setStatus("not supported (use Chrome / Edge)", "err");
  </script>
</body>
</html>
